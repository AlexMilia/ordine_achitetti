/* Small dependency-free pseudo-3D CAD preview: all coordinates are drawn client-side in Canvas. */
class BuildingViewer{

 }

 draw(){const c=this.canvas,ctx=this.ctx;if(!ctx)return;const dpr=Math.min(window.devicePixelRatio||1,2),w=c.clientWidth||650,h=c.clientHeight||470;const rw=Math.round(w*dpr),rh=Math.round(h*dpr);if(c.width!==rw||c.height!==rh){c.width=rw;c.height=rh;}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const dark=true;const grad=ctx.createRadialGradient(w*.55,h*.38,1,w*.55,h*.45,Math.max(w,h)*.68);grad.addColorStop(0,'#1b4040');grad.addColorStop(1,'#09161b');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);let r=Math.min(w/9.7,h/7.6)*this.zoom;const project=([x,y,z])=>{const ca=Math.cos(this.a),sa=Math.sin(this.a),cb=Math.cos(this.b),sb=Math.sin(this.b);const px=x*ca-z*sa,pz=x*sa+z*ca,py=y*cb-pz*sb;return [w*.5+px*r,h*.56-py*r+pz*cb*r*.24];};const line=(a,b,color,width=1,alpha=1)=>{const p=project(a),q=project(b);ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(...p);ctx.lineTo(...q);ctx.stroke();ctx.globalAlpha=1;};const polygon=(points,fill,stroke='#c9e5c5',width=1)=>{ctx.beginPath();points.forEach((p,i)=>{const v=project(p);if(i===0)ctx.moveTo(...v);else ctx.lineTo(...v);});ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();};const cyan='#81b6b1',lime='#c9f68a',soft='#53817c';
 // CAD working grid
 for(let i=-7;i<=7;i++){line([i,-1.02,-7],[i,-1.02,7],'#426c6b',.65,.28);line([-7,-1.02,i],[7,-1.02,i],'#426c6b',.65,.28);}line([-6,-1.0,0],[6,-1,0],lime,1,.45);line([0,-1,-6],[0,-1,6],cyan,1,.45);
